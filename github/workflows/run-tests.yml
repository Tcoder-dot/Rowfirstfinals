name: Run tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libatlas-base-dev
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          pip install -r requirements.txt || true
          # fallback: install critical test deps explicitly
          pip install scipy statsmodels pandas matplotlib python-docx reportlab
      - name: Run tests
        run: |
          python3 -m pip list
          python3 tests/test_gold.py